<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VCATS Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1c1c24;
            --text-color: #ffffff;
            --hint-color: #8b8b9a;
            --accent-color: #8b5cf6;
            --btn-bg: #2a2a35;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #1c1c24;
        }
        .header h1 { 
            font-size: 20px; 
            font-weight: 900; 
            letter-spacing: 2px; 
            background: linear-gradient(90deg, #a78bfa, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .banner {
            margin: 15px;
            padding: 20px;
            background: linear-gradient(135deg, #2a1b54 0%, #1c1c24 100%);
            border-radius: 16px;
            border: 1px solid #3b2d6b;
        }
        .banner h2 { font-size: 16px; margin-bottom: 8px; }
        .banner p { font-size: 12px; color: var(--hint-color); line-height: 1.4; }

        .categories {
            display: flex;
            gap: 10px;
            padding: 0 15px 15px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            background: var(--card-bg);
            color: var(--hint-color);
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }
        .cat-btn.active { background: var(--accent-color); color: #fff; box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 15px;
        }
        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .product-img {
            width: 100%;
            height: 140px;
            background: #2a2a35;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 10px;
        }
        .product-title { font-size: 13px; font-weight: 600; margin-bottom: 5px; line-height: 1.2; }
        .product-price { font-size: 16px; font-weight: 800; color: #fff; margin-top: auto; }
        
        .add-btn {
            background: var(--btn-bg);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .add-btn:active { background: var(--accent-color); transform: scale(0.98); }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(28, 28, 36, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #2a2a35;
            z-index: 20;
        }
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: var(--hint-color); 
            font-size: 11px; 
            gap: 4px; 
            cursor: pointer;
        }
        .nav-item.active { color: var(--accent-color); }
        .nav-icon { font-size: 22px; }

        .cart-view {
            display: none;
            padding: 15px;
            flex-direction: column;
            gap: 12px;
        }
        .cart-view h2 { font-size: 20px; margin-bottom: 10px; }
        .cart-item {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a2a35;
        }
        .cart-item-info { display: flex; flex-direction: column; gap: 4px; }
        .cart-item-name { font-weight: 600; font-size: 14px; }
        .cart-item-qty { color: var(--hint-color); font-size: 13px; }
        .cart-item-price { font-weight: 800; font-size: 15px; }
        
        .cart-summary {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #2a2a35;
        }
        .cart-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
        }
        
        .checkout-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }
        .checkout-btn:active { transform: scale(0.98); }
        
        .empty-cart { text-align: center; color: var(--hint-color); margin-top: 40px; font-size: 15px; }
        .loading { text-align: center; color: var(--hint-color); padding: 20px; grid-column: span 2; }
        
        .profile-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #2a2a35;
        }
        .profile-row { display: flex; justify-content: space-between; font-size: 15px; }
        .profile-label { color: var(--hint-color); }
        .support-btn {
            background: #2a2a35;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>VCATS</h1>
    </div>

    <!-- КАТАЛОГ -->
    <div id="store-view">
        <div class="banner">
            <h2>🔥 Добро пожаловать в VCATS</h2>
            <p>Только оригинальные товары. Быстрая доставка и самовывоз. 18+</p>
        </div>

        <div class="categories">
            <button class="cat-btn active">Все товары</button>
            <button class="cat-btn">Подсы</button>
            <button class="cat-btn">Жидкости</button>
            <button class="cat-btn">Расходники</button>
        </div>

        <div class="grid" id="product-grid">
            <div class="loading">Загрузка товаров...</div>
        </div>
    </div>

    <!-- КОРЗИНА -->
    <div id="cart-view" class="cart-view">
        <h2>🛒 Корзина</h2>
        <div id="cart-items"></div>
        
        <div class="cart-summary" id="cart-summary" style="display: none;">
            <div class="cart-total-row">
                <span>Итого:</span>
                <span><span id="cart-total">0</span> ₽</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
        </div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="profile-view" class="cart-view">
        <h2>👤 Профиль</h2>
        
        <div class="profile-card">
            <div class="profile-row">
                <span class="profile-label">Ваш ID:</span>
                <span id="tg-user-id">Загрузка...</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Статус:</span>
                <span style="color: var(--accent-color); font-weight: bold;">Клиент</span>
            </div>
        </div>

        <!-- Замените name_castsd на свой юзернейм в Telegram -->
        <a href="https://t.me/name_castsd" target="_blank" class="support-btn">
            ✉️ Связаться с поддержкой
        </a>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-store" onclick="showTab('store')">
            <span class="nav-icon">🛍</span>
            Каталог
        </div>
        <div class="nav-item" id="nav-cart" onclick="showTab('cart')">
            <span class="nav-icon">🛒</span>
            Корзина <span id="cart-badge" style="display:none; background:var(--accent-color); color:white; border-radius:50%; padding:2px 6px; font-size:10px; position:absolute; transform:translate(10px,-5px);">0</span>
        </div>
        <div class="nav-item" id="nav-profile" onclick="showTab('profile')">
            <span class="nav-icon">👤</span>
            Профиль
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0f0f13');
        tg.setBackgroundColor('#0f0f13');

        let products = [];
        let cart = [];

        // ССЫЛКА НА ВАШ API НА RENDER
        const API_URL = 'https://shop-miniapp-1-fbot.onrender.com/api/products';

        // Загрузка ID пользователя в профиль
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('tg-user-id').innerText = tg.initDataUnsafe.user.id;
        } else {
            document.getElementById('tg-user-id').innerText = "Гость";
        }

        async function loadProducts() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Ошибка сети');
                
                products = await response.json();
                
                if (products.length === 0) {
                    document.getElementById('product-grid').innerHTML = '<div class="loading">В магазине пока нет товаров</div>';
                    return;
                }
                
                renderProducts();
            } catch (error) {
                console.error("Ошибка загрузки:", error);
                document.getElementById('product-grid').innerHTML = '<div class="loading" style="color: #ef4444;">Не удалось загрузить товары.<br>Сервер просыпается, подождите 30 сек и обновите.</div>';
            }
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.image}" class="product-img" alt="${p.name}" onerror="this.src='https://via.placeholder.com/150x150/1c1c24/8b5cf6?text=VCATS'">
                    <div class="product-title">${p.name}</div>
                    <div class="product-price">${p.price} ₽</div>
                    <button class="add-btn" onclick="addToCart(${p.id})">В корзину</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const cartItem = cart.find(item => item.id === id);
            
            if (cartItem) {
                cartItem.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const summaryEl = document.getElementById('cart-summary');
            const badgeEl = document.getElementById('cart-badge');
            
            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-cart">Ваша корзина пока пуста</div>';
                summaryEl.style.display = 'none';
                badgeEl.style.display = 'none';
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-qty">${item.qty} шт.</div>
                    </div>
                    <div class="cart-item-price">${item.price * item.qty} ₽</div>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            totalEl.innerText = total;
            summaryEl.style.display = 'block';
            
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            badgeEl.innerText = totalItems;
            badgeEl.style.display = 'inline-block';
        }

        function showTab(tab) {
            document.getElementById('store-view').style.display = tab === 'store' ? 'block' : 'none';
            document.getElementById('cart-view').style.display = tab === 'cart' ? 'flex' : 'none';
            document.getElementById('profile-view').style.display = tab === 'profile' ? 'flex' : 'none';
            
            document.getElementById('nav-store').classList.toggle('active', tab === 'store');
            document.getElementById('nav-cart').classList.toggle('active', tab === 'cart');
            document.getElementById('nav-profile').classList.toggle('active', tab === 'profile');
        }

        function checkout() {
            if (cart.length === 0) {
                if (tg.showAlert) tg.showAlert("Корзина пуста!");
                return;
            }
            
            const orderData = {
                action: "create_order",
                items: cart,
                total: cart.reduce((sum, item) => sum + (item.price * item.qty), 0)
            };

            tg.sendData(JSON.stringify(orderData));
        }

        loadProducts();
        renderCart();
    </script>
</body>
</html>
